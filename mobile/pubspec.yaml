name: hangbug
description: "Hangbug - Web Development Technology Quiz & Certification Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking & HTTP
  dio: ^5.7.0

  # Secure & Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Declarative Routing & Navigation
  go_router: ^14.6.2

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1

  # Visuals, QR & Fonts
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#193D35"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#193D35"
  image: "assets/images/logo.png"
  android_12:
    color: "#193D35"
    image: "assets/images/icon.png"
