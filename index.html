<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HangBug — Debug Your Knowledge. Build Your Future.</title>
    <meta name="description" content="HangBug is a modern web development quiz & certification platform. Practice quizzes, earn verified certificates, and compete on global leaderboards." />
    <meta name="google-adsense-account" content="ca-pub-6869652365081842">
    <meta name="theme-color" content="#193D35" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hangbug-theme');
          var mode = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          root.setAttribute('data-theme-preference', mode);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0F1513' : '#193D35');
          }
        } catch (e) {}
      })();
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6869652365081842"
     crossorigin="anonymous"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[var(--page-bg)] text-[var(--foreground)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
